nameOverride: frontend
fullnameOverride: frontend

controller:
  replicas: 2
  strategy: RollingUpdate
  rollingUpdate:
    surge: 1
    unavailable: 0

image:
  repository: ghcr.io/test/assessment-frontend
  tag: latest
  pullPolicy: Always

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001

env:
  NODE_ENV: production
  NEXT_PUBLIC_API_URL: "http://backend:4000/api"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  liveness:
    enabled: true
    custom: true
    spec:
      httpGet:
        path: /
        port: 3002
      initialDelaySeconds: 40
      periodSeconds: 20
      failureThreshold: 3
  readiness:
    enabled: true
    custom: true
    spec:
      httpGet:
        path: /
        port: 3002
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 3
  startup:
    enabled: false

service:
  main:
    enabled: true
    ports:
      http:
        enabled: true
        primary: true
        port: 3002

ingress:
  main:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    hosts:
      - host: test.com
        paths:
          - path: /
            pathType: Prefix
          - path: /api
            pathType: Prefix
            service:
              name: backend
              port: 4000
    tls: []

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
