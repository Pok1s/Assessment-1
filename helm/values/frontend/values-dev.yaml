controller:
  replicas: 1

autoscaling:
  enabled: false

env:
  NEXT_PUBLIC_API_URL: "http://localhost:4000/api"

ingress:
  main:
    hosts:
      - host: dev.test.com
        paths:
          - path: /
            pathType: Prefix
          - path: /api
            pathType: Prefix
            service:
              name: backend
              port: 4000
